# 동의 상태 (설계서 §1.4, §1.7 "동의 모드")
#
# mode:
#   named — 닉네임을 그대로 유지해 발행한다. 참여자 동의를 방 공지 등으로
#           확보한 뒤에만 이 값으로 바꾼다 (G-C 게이트).
#   anon  — 닉네임을 구간 내 일관된 가명(참여자A, 참여자B, ...)으로 치환한다.
#
# 운영 시작 전 G-C 게이트를 거치지 않았다면 반드시 anon으로 둔다.
mode: anon

# 이 모드를 마지막으로 바꾼 사람/시점 (수기 관리, 감사 추적용)
last_changed_by: null
